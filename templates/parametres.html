{% block title %}Paramètres{% endblock %}

{% block content %}
<div class="container">
    <h1>Paramètres</h1>
    <div class="setting-block">
  <label class="setting-label">Interface</label>

  <div class="switch-container interface-switch">

    <label class="switch">
      <input type="checkbox" id="interface-toggle" checked>

    </label>

    <span class="switch-label">PC</span>
  </div>
</div>

</div>
{% endblock %}
